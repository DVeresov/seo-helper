name: web-seo-helper

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-helper-app
    restart: always
    working_dir: /var/www/
    volumes:
      - ..:/var/www/
    depends_on:
      - db
    networks:
      - seo-network

  nginx:
    image: nginx:1.26-alpine
    container_name: seo-helper-nginx
    restart: always
    ports:
      - 8000:80
    volumes:
      - ..:/var/www
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - seo-network

  db:
    container_name: seo-helper-db
    image: mysql:8.4
    volumes:
      - ../storage/mysql:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seo_helper_db
      MYSQL_USER: seo_user
      MYSQL_PASSWORD: seo_password
    ports:
      - 3308:3306
    networks:
      - seo-network

  phpmyadmin:
    container_name: seo-helper-phpmyadmin
    image: phpmyadmin
    restart: always
    ports:
      - 8001:80
    environment:
      - PMA_HOST=seo-helper-db
      - PMA_USER=root
      - PMA_PASSWORD=root
    depends_on:
      - db
    networks:
      - seo-network

networks:
  seo-network:
    driver: bridge